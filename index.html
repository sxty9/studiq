<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c1c1e'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23BF5AF2' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23BF5AF2'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#000000" />
    <title>studiq</title>
    <script>
      // Restore the saved theme before first paint (default: dark) to avoid a flash.
      try {
        var t = localStorage.getItem('sq.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
