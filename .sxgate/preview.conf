# sxgate preview manifest for studiq — how to build & serve a branch sandbox.
# Sourced by `sxgate preview`; placeholders {worktree} {state} {zone} {port} are expanded by the
# engine (single-quote values that must defer to run time). See ~/sxgate/lib/preview.sh.
#
# studiq cut 1 is a mock-first, frontend-only SPA: there is NO backend yet (the Go studiqd + the
# aigentic/lakearch wiring are deferred behind the DataSource seam). So this is a pure STATIC
# preview — no /api reverse-proxy, no systemd backend instance (RUN is intentionally omitted).
# When studiqd lands, switch MODE to static_proxy and add BUILD (go build) + RUN, like devlab.

SERVICE="studiq"

# Self-contained build: install deps in the throwaway worktree, then produce the Vite SPA in dist/.
BUILD="cd {worktree} && CI=true npm install --no-audit --no-fund --silent && npm run build"

# Static SPA server: root {worktree}/dist with SPA fallback to index.html. No backend.
MODE="static"
ROOT="dist"

# Purely informational note surfaced after `preview up`.
SEED='echo "Sandboxed studiq preview — mock-first SPA (no backend). All data is seeded client-side; nothing persists."'
